<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CipherVault | Upload File</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #dbe7ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .upload-container {
            width: 100%;
            max-width: 760px;
        }

        .upload-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 38px 42px;
            box-shadow: 0 15px 45px rgba(30, 70, 150, 0.15);
        }

        /* Header */

        .upload-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .upload-header .shield {
            width: 64px;
            height: 64px;
            margin: 0 auto 15px;
            border-radius: 18px;
            background: #edf3ff;
            color: #2864e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .upload-header h1 {
            font-size: 32px;
            color: #1d4ed8;
            margin-bottom: 8px;
        }

        .upload-header p {
            color: #64748b;
            font-size: 16px;
        }

        /* Upload Area */

        .upload-area {
            border: 2px dashed #4f7ff0;
            background: #f8faff;
            border-radius: 18px;
            padding: 48px 25px;
            text-align: center;
            transition: 0.3s;
        }

        .upload-area:hover {
            background: #f0f5ff;
            border-color: #245fe0;
        }

        .upload-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #e6efff;
            color: #2864e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .upload-area h3 {
            font-size: 20px;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .upload-area p {
            color: #94a3b8;
            margin-bottom: 18px;
        }

        /* Choose File */

        #chooseFileBtn {
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        #chooseFileBtn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        #chooseFileBtn i {
            margin-right: 8px;
        }

        /* File Details */

        .file-details {
            margin-top: 22px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .file-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: #e8f0ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .file-info {
            flex: 1;
        }

        .file-info p {
            margin: 5px 0;
            color: #475569;
            font-size: 14px;
        }

        .file-info strong {
            color: #1e293b;
        }

        /* Buttons */

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }

        #encryptBtn,
        #clearBtn {
            flex: 1;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        #encryptBtn {
            background: #16a34a;
            color: white;
        }

        #encryptBtn:hover {
            background: #15803d;
            transform: translateY(-1px);
        }

        #clearBtn {
            background: #fee2e2;
            color: #dc2626;
        }

        #clearBtn:hover {
            background: #fecaca;
        }

        /* Back Button */

        #backBtn {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #f1f5f9;
            color: #475569;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        #backBtn:hover {
            background: #e2e8f0;
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .upload-card {
                padding: 28px 20px;
            }

            .upload-header h1 {
                font-size: 27px;
            }

            .upload-area {
                padding: 35px 15px;
            }

            .button-group {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <div class="upload-container">

        <div class="upload-card">

            <!-- Header -->

            <div class="upload-header">

                <div class="shield">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>

                <h1>Upload File</h1>

                <p>
                    Securely upload and encrypt your file
                </p>

            </div>


            <!-- Upload Area -->

            <div class="upload-area" id="dropArea">

                <div class="upload-icon">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>

                <h3>
                    Drag & Drop your file here
                </h3>

                <p>or</p>

                <button
                    type="button"
                    id="chooseFileBtn">

                    <i class="fa-solid fa-folder-open"></i>

                    Choose File

                </button>

                <input
                    type="file"
                    id="fileInput"
                    hidden>

            </div>


            <!-- File Details -->

            <div class="file-details" id="fileDetails">

                <div class="file-icon">

                    <i class="fa-solid fa-file"></i>

                </div>

                <div class="file-info">

                    <p>
                        <strong>File Name:</strong>
                        <span id="fileName">No file selected</span>
                    </p>

                    <p>
                        <strong>File Size:</strong>
                        <span id="fileSize">-</span>
                    </p>

                    <p>
                        <strong>File Type:</strong>
                        <span id="fileType">-</span>
                    </p>

                </div>

            </div>


            <!-- Action Buttons -->

            <div class="button-group">

                <button
                    type="button"
                    id="encryptBtn">

                    <i class="fa-solid fa-lock"></i>

                    Encrypt & Upload

                </button>

                <button
                    type="button"
                    id="clearBtn">

                    <i class="fa-solid fa-trash"></i>

                    Clear

                </button>

            </div>


            <!-- Back -->

            <button
                type="button"
                id="backBtn">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Dashboard

            </button>

        </div>

    </div>


    <script src="js/upload.js"></script>

</body>

</html>
