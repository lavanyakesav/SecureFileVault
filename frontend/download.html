<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CipherVault | Download File</title>

    <link rel="stylesheet" href="css/download.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="download-card">

        <h1>
            <i class="fa-solid fa-download"></i>
            Download & Decrypt
        </h1>

        <p>Select an encrypted file (.enc) to decrypt.</p>

        <input
            type="file"
            id="fileInput"
            accept=".enc">

        <div class="file-details">

            <p>
                <strong>File :</strong>
                <span id="fileName">
                    No File Selected
                </span>
            </p>

        </div>

        <div class="buttons">

            <button id="downloadBtn">

                <i class="fa-solid fa-unlock"></i>

                Download & Decrypt

            </button>

            <button
                id="backBtn">

                <i class="fa-solid fa-arrow-left"></i>

                Back

            </button>

        </div>

    </div>

</div>

<script src="js/download.js"></script>

</body>
</html>
