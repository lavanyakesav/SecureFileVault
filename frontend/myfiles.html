<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CipherVault | My Files</title>

    <link rel="stylesheet" href="css/myfiles.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="files-card">

        <h1>
            <i class="fa-solid fa-folder-open"></i>
            My Encrypted Files
        </h1>

        <table>

            <thead>

                <tr>

                    <th>File Name</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="fileTable">

                <tr>

                    <td colspan="2">

                        No Files Available

                    </td>

                </tr>

            </tbody>

        </table>

        <br>

        <button id="backBtn">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Dashboard

        </button>

    </div>

</div>

<script src="js/myfiles.js"></script>

</body>
</html>
